<section class="max-w-2xl mx-auto md:mx-0 md:max-w-5xl">
  <div class="mb-6 md:mb-8">
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider text-jager-light uppercase">Készletkezelés</h1>
    <p class="text-gray-400 text-sm mt-1">Nyeremények létrehozása és feltöltése.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

    <!-- Új nyeremény létrehozó kártya -->
    <div class="jager-card p-5">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-lg">✚</span>
        <h2 class="font-bold tracking-wider text-sm uppercase text-jager-orange">Új nyeremény</h2>
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-300 mb-1">Megnevezés</label>
        <input
          type="text"
          [ngModel]="newMerchName"
          (ngModelChange)="newMerchNameChange.emit($event)"
          placeholder="pl. Jäger kemcső 2cl"
          class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-jager-light focus:outline-none focus:border-jager-orange focus:ring-1 focus:ring-jager-orange transition-colors placeholder-gray-600 text-base"
        />
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-300 mb-1">Típus</label>
        <div class="grid grid-cols-2 gap-2">
          <button
            (click)="newMerchIsLiquidChange.emit(false)"
            [class]="!newMerchIsLiquid ? 'py-3 rounded-lg text-sm font-medium bg-jager-orange/10 border border-jager-orange/40 text-jager-orange transition-colors' : 'py-3 rounded-lg text-sm font-medium bg-black/40 border border-gray-700 text-gray-400 transition-colors'"
          >🎁 Merch</button>
          <button
            (click)="newMerchIsLiquidChange.emit(true)"
            [class]="newMerchIsLiquid ? 'py-3 rounded-lg text-sm font-medium bg-jager-orange/10 border border-jager-orange/40 text-jager-orange transition-colors' : 'py-3 rounded-lg text-sm font-medium bg-black/40 border border-gray-700 text-gray-400 transition-colors'"
          >🍶 Folyadék</button>
        </div>
      </div>
      <button
        (click)="createMerch.emit()"
        [disabled]="loading || !newMerchName.trim()"
        class="w-full bg-jager-orange hover:bg-orange-600 disabled:opacity-40 text-black font-bold py-3 rounded-lg transition-colors tracking-wider uppercase text-sm"
      >
        @if (loading) { Kérjük várj... } @else { Létrehozás }
      </button>
    </div>

    <!-- Meglévő készlet elemek -->
    @for (item of inventoryItems; track item.id) {
      <app-admin-inventory-item
        [item]="item"
        [addStockMap]="addStockMap"
        (addStock)="addStock.emit($event)"
        (subtractStock)="subtractStock.emit($event)"
        (setQuickStock)="setQuickStock.emit($event)"
        (deleteItem)="deleteItem.emit($event)"
        (stockInputChange)="onStockInputChange($event)"
      />
    }

    <!-- Üres állapot -->
    @if (inventoryItems.length === 0) {
      <div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-600">
        <span class="text-4xl mb-3">📦</span>
        <p class="text-sm">Még nincs nyeremény létrehozva.</p>
      </div>
    }

  </div>
</section>
