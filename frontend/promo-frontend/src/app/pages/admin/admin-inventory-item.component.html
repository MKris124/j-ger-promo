<div class="jager-card p-5 flex flex-col">

  <!-- Fejléc: típus badge + név + készlet szám -->
  <div class="flex items-start justify-between mb-3">
    <div class="flex-1 min-w-0 pr-3">
      @if (item.liquid) {
        <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-1.5">🍶 Folyadék</span>
      } @else {
        <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase bg-purple-500/10 text-purple-400 border border-purple-500/20 mb-1.5">🎁 Merch</span>
      }
      <h3 class="text-sm font-semibold text-jager-light leading-tight break-words">{{ item.name }}</h3>
    </div>
    <div class="text-right flex-shrink-0">
      <div [class]="item.stock < 10 ? 'text-3xl font-black text-red-400 leading-none' : 'text-3xl font-black text-jager-orange leading-none'">{{ item.stock }}</div>
      <div class="text-[10px] text-gray-500 uppercase tracking-wide mt-0.5">db</div>
    </div>
  </div>

  <!-- Készlet progress bar -->
  <div class="mb-4">
    <div class="h-1.5 bg-gray-700 rounded-full overflow-hidden">
      <div [class]="item.stock < 10 ? 'h-full bg-red-400 rounded-full transition-all' : 'h-full bg-jager-orange rounded-full transition-all'" [style.width.%]="getStockPercent(item.stock)"></div>
    </div>
    <span [class]="item.stock < 10 ? 'text-[10px] text-red-400 mt-1 block' : 'text-[10px] text-gray-500 mt-1 block'">
      {{ item.stock < 10 ? '⚠ Alacsony készlet' : '✓ Rendben' }}
    </span>
  </div>

  <!-- Gyors feltöltő gombok + input + műveletek -->
  <div class="mt-auto flex flex-col gap-2">

    <!-- Gyors mennyiség gombok (folyadék: literben, merch: darabban) -->
    @if (item.liquid) {
      <div class="flex gap-1.5">
        <button (click)="setQuickStock.emit({ item, value: 0.5 })" class="flex-1 py-1.5 bg-white/5 hover:bg-jager-orange/20 border border-white/10 hover:border-jager-orange/50 text-[10px] font-bold text-gray-400 hover:text-jager-orange rounded-md transition-colors uppercase tracking-widest">0.5L</button>
        <button (click)="setQuickStock.emit({ item, value: 0.7 })" class="flex-1 py-1.5 bg-white/5 hover:bg-jager-orange/20 border border-white/10 hover:border-jager-orange/50 text-[10px] font-bold text-gray-400 hover:text-jager-orange rounded-md transition-colors uppercase tracking-widest">0.7L</button>
        <button (click)="setQuickStock.emit({ item, value: 1.0 })" class="flex-1 py-1.5 bg-white/5 hover:bg-jager-orange/20 border border-white/10 hover:border-jager-orange/50 text-[10px] font-bold text-gray-400 hover:text-jager-orange rounded-md transition-colors uppercase tracking-widest">1.0L</button>
        <button (click)="setQuickStock.emit({ item, value: 1.75 })" class="flex-1 py-1.5 bg-white/5 hover:bg-jager-orange/20 border border-white/10 hover:border-jager-orange/50 text-[10px] font-bold text-gray-400 hover:text-jager-orange rounded-md transition-colors uppercase tracking-widest">1.75L</button>
      </div>
    } @else {
      <div class="flex gap-1.5">
        <button (click)="setQuickStock.emit({ item, value: 1 })"  class="flex-1 py-1.5 bg-white/5 hover:bg-purple-500/20 border border-white/10 hover:border-purple-500/50 text-[10px] font-bold text-gray-400 hover:text-purple-400 rounded-md transition-colors uppercase tracking-widest">1 db</button>
        <button (click)="setQuickStock.emit({ item, value: 5 })"  class="flex-1 py-1.5 bg-white/5 hover:bg-purple-500/20 border border-white/10 hover:border-purple-500/50 text-[10px] font-bold text-gray-400 hover:text-purple-400 rounded-md transition-colors uppercase tracking-widest">5 db</button>
        <button (click)="setQuickStock.emit({ item, value: 10 })" class="flex-1 py-1.5 bg-white/5 hover:bg-purple-500/20 border border-white/10 hover:border-purple-500/50 text-[10px] font-bold text-gray-400 hover:text-purple-400 rounded-md transition-colors uppercase tracking-widest">10 db</button>
        <button (click)="setQuickStock.emit({ item, value: 50 })" class="flex-1 py-1.5 bg-white/5 hover:bg-purple-500/20 border border-white/10 hover:border-purple-500/50 text-[10px] font-bold text-gray-400 hover:text-purple-400 rounded-md transition-colors uppercase tracking-widest">50 db</button>
      </div>
    }

    <!-- Egyéni érték input + levon / feltölt -->
    <div class="flex gap-2">
      <input
        type="number"
        [step]="item.liquid ? '0.1' : '1'"
        min="0"
        [ngModel]="addStockMap[item.id]"
        (ngModelChange)="stockInputChange.emit({ id: item.id, value: $event })"
        [placeholder]="item.liquid ? 'liter' : 'db'"
        class="flex-1 min-w-0 w-full px-3 py-3 bg-black/40 border border-gray-700 rounded-lg text-base text-jager-light placeholder-gray-600 focus:outline-none focus:border-jager-orange focus:ring-1 focus:ring-jager-orange transition-colors [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      />
      <button
        (click)="subtractStock.emit(item)"
        [disabled]="!addStockMap[item.id] || addStockMap[item.id] <= 0"
        class="flex-shrink-0 px-3 py-3 bg-red-500/10 hover:bg-red-500/20 disabled:opacity-30 border border-red-500/30 text-red-400 text-xs font-bold rounded-lg transition-colors uppercase tracking-wider"
      >- Levon</button>
      <button
        (click)="addStock.emit(item)"
        [disabled]="!addStockMap[item.id] || addStockMap[item.id] <= 0"
        class="flex-shrink-0 px-3 py-3 bg-green-500/10 hover:bg-green-500/20 disabled:opacity-30 border border-green-500/30 text-green-400 text-xs font-bold rounded-lg transition-colors uppercase tracking-wider"
      >+ Feltölt</button>
    </div>

    <!-- Archiválás gomb -->
    <button
      (click)="deleteItem.emit(item)"
      class="w-full py-2.5 border border-red-500/20 text-red-400/60 hover:border-red-500/50 hover:text-red-400 text-xs uppercase tracking-widest font-bold rounded-lg transition-colors mt-1"
    >Elrejtés (Archiválás)</button>
  </div>

</div>
