<div class="min-h-screen flex flex-col bg-jager-dark text-jager-light">

  <app-page-header
    title="ADMIN"
    [currentTab]="getActiveTabLabel()"
    (tabChanged)="activeTab = $any($event)"
  >
    @if (settings.eventActive) {
      <div style="display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;">
        <span style="width:5px;height:5px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;"></span>
        Aktív
      </div>
    } @else {
      <div style="display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;">
        <span style="width:5px;height:5px;border-radius:50%;background:#f87171;"></span>
        Szünetel
      </div>
    }
  </app-page-header>

  <main class="flex-1 overflow-y-auto p-4 md:p-8">

    <!-- Toast értesítés -->
    @if (toast) {
      <div [class]="toast.type === 'success'
        ? 'fixed left-4 right-4 md:left-auto md:right-6 md:w-auto px-5 py-3 rounded-xl border border-green-500/40 bg-[#0a0a0a] text-green-400 text-sm font-medium text-center shadow-xl'
        : 'fixed left-4 right-4 md:left-auto md:right-6 md:w-auto px-5 py-3 rounded-xl border border-red-500/40 bg-[#0a0a0a] text-red-400 text-sm font-medium text-center shadow-xl'"
        style="top: 72px; z-index: 200;"
      >
        {{ toast.message }}
      </div>
    }

    <!-- Tab tartalmak -->
    @if (activeTab === 'settings') {
      <app-admin-settings-tab
        [settings]="settings"
        [games]="games"
        [loading]="loading"
        [shotsPerLiterInput]="shotsPerLiterInput"
        (shotsPerLiterInputChange)="shotsPerLiterInput = $event"
        [scheduleMode]="scheduleMode"
        (scheduleModeChange)="scheduleMode = $event"
        [eventStartInput]="eventStartInput"
        (eventStartInputChange)="eventStartInput = $event"
        [eventEndInput]="eventEndInput"
        (eventEndInputChange)="eventEndInput = $event"
        (toggleEvent)="toggleEvent()"
        (updateSettings)="updateSettings()"
        (setActiveGame)="setActiveGame($event)"
      />
    }

    @if (activeTab === 'games') {
      <app-admin-games-tab
        [registeredGames]="registeredGames"
        [games]="games"
        [settings]="settings"
        [loading]="loading"
        (addGameFromRegistry)="addGameFromRegistry($event)"
        (deleteGame)="deleteGame($event)"
        (setActiveGameByKey)="setActiveGameByKey($event)"
      />
    }

    @if (activeTab === 'inventory') {
      <app-admin-inventory-tab
        [inventoryItems]="inventoryItems"
        [loading]="loading"
        [newMerchName]="newMerchName"
        [newMerchIsLiquid]="newMerchIsLiquid"
        [addStockMap]="addStockMap"
        [shotsPerLiter]="settings.shotsPerLiter"
        (createMerch)="createMerch()"
        (addStock)="addStock($event)"
        (subtractStock)="subtractStock($event)"
        (setQuickStock)="setQuickStock($event.item, $event.value)"
        (deleteItem)="deleteItem($event)"
        (newMerchNameChange)="newMerchName = $event"
        (newMerchIsLiquidChange)="newMerchIsLiquid = $event"
      />
    }

    @if (activeTab === 'users') {
      <app-admin-users-tab
        [users]="users"
        [filteredUsers]="filteredUsers"
        [userSearchTerm]="userSearchTerm"
        [roleOptions]="roleOptions"
        (changeRole)="changeRole($event.user, $event.role)"
        (searchTermChange)="userSearchTerm = $event"
      />
    }

    @if (activeTab === 'feedbacks') {
      <app-admin-feedbacks-tab
        [feedbacks]="feedbacks"
      />
    }

  </main>
</div>
