spring:
  application:
    name: jager-promo-backend
  profiles:
    active: dev

---
# ===========================
# DEV — H2
# ===========================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/jager_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  base-url: http://localhost:4200
  jwt:
    secret: dev-secret-key-min-32-characters-long
    expiration: 86400000
  mail:
    from: no-reply@jager-sbm-game.hu

# Nincs spring.mail.host beállítva dev-ben -> nem jön létre JavaMailSender bean,
# az EmailService ilyenkor a szerver logba írja ki a megerősítő kódot

---
# ===========================
# PROD — PostgreSQL (Docker)
# ===========================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://postgres:5432/jagerpromo
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Env-változóval hangolható esemény napján, kód-módosítás nélkül
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

  mail:
    # Üres alapértelmezés — ha ezek nincsenek beállítva a szerveren, az app AKKOR IS elinduljon
    # (csak a levélküldés hibázik majd egyesével, nem a teljes backend a boot-nál)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Az Nginx Proxy Manager mögött fut — enélkül request.getRemoteAddr() mindig
# az NPM konténer belső IP-jét adná vissza minden kérésre, nem a valódi kliensét,
# ami az IP-alapú rate limitinget teljesen hatástalanná tenné
server:
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  mail:
    from: ${MAIL_FROM:no-reply@jager-sbm-game.hu}